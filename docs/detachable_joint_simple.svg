<line x1="1444.0" y1="486.0" x2="1444.0" y2="508.0" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="2 5"/>
<line x1="1423.0" y1="418.0" x2="1447.0" y2="418.0" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="1461.0" y="423.0" font-size="15" fill="#8a8a8a">joint removed</text>
<text x="1395" y="665" text-anchor="middle" font-size="15" letter-spacing="3" fill="#8a8a8a">DETACHED</text>
<text x="1395" y="691" text-anchor="middle" font-size="15" fill="#8a8a8a">joint removed: the cube falls</text>
<text x="800.0" y="758" text-anchor="middle" font-size="13" fill="#555">the plugin welds the cube as soon as it loads — release it first with “detach”, then touch the cube before “attach”</text>
</svg>