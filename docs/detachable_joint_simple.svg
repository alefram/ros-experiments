<rect x="316.0" y="427.0" width="28" height="18" rx="4" fill="#000" stroke="#fff" stroke-width="2"/>
<circle cx="130.0" cy="513.0" r="9" fill="#000" stroke="#fff" stroke-width="2"/>
<circle cx="213.0" cy="415.6" r="9" fill="#000" stroke="#fff" stroke-width="2"/>
<circle cx="330.0" cy="400.0" r="7" fill="#000" stroke="#fff" stroke-width="2"/>
<rect x="315.0" y="510.0" width="30.0" height="30.0" fill="#2f80ff"/>
<text x="210" y="665" text-anchor="middle" font-size="15" letter-spacing="3" fill="#8a8a8a">DETACHED</text>
<text x="210" y="691" text-anchor="middle" font-size="15" fill="#8a8a8a">cube rests on the chair</text>
<text x="405" y="450" font-size="26" fill="#3a3a3a">›</text>
<text x="605" y="250" text-anchor="middle" font-size="22" letter-spacing="4" fill="#fff">02 · ATTACH</text>
<text x="605" y="280" text-anchor="middle" font-size="16" fill="#2f80ff">send “attach”</text>
<line x1="420" y1="600" x2="790" y2="600" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="480" y="540" width="90" height="60" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
