<line x1="725.0" y1="464.0" x2="725.0" y2="491.0" stroke="#fff" stroke-width="12" stroke-linecap="round"/><line x1="725.0" y1="464.0" x2="725.0" y2="491.0" stroke="#000" stroke-width="9" stroke-linecap="round"/>
<rect x="711.0" y="491.0" width="28" height="18" rx="4" fill="#000" stroke="#fff" stroke-width="2"/>
