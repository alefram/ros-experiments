<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="Helvetica, Arial, sans-serif">
<rect width="1600" height="800" fill="#000"/>
<text x="800.0" y="70" text-anchor="middle" font-size="30" font-weight="300" letter-spacing="6" fill="#fff">HOW THE DETACHABLE JOINT WORKS</text>
<line x1="730.0" y1="92" x2="870.0" y2="92" stroke="#2f80ff" stroke-width="2"/>
<text x="800.0" y="135" text-anchor="middle" font-size="17" fill="#8a8a8a">A fixed joint is created between the suction cup and the cube, and removed on command.</text>
<text x="210" y="250" text-anchor="middle" font-size="22" letter-spacing="4" fill="#fff">01 · START</text>
<text x="210" y="280" text-anchor="middle" font-size="16" fill="#2f80ff"></text>
<line x1="25" y1="600" x2="395" y2="600" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="85" y="540" width="90" height="60" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="285" y="540" width="90" height="60" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="108" y="513" width="44" height="27" fill="#000" stroke="#fff" stroke-width="2"/>
<line x1="130.0" y1="513.0" x2="213.0" y2="415.6" stroke="#fff" stroke-width="16" stroke-linecap="round"/><line x1="130.0" y1="513.0" x2="213.0" y2="415.6" stroke="#000" stroke-width="13" stroke-linecap="round"/>
<line x1="213.0" y1="415.6" x2="330.0" y2="400.0" stroke="#fff" stroke-width="16" stroke-linecap="round"/><line x1="213.0" y1="415.6" x2="330.0" y2="400.0" stroke="#000" stroke-width="13" stroke-linecap="round"/>
