<text x="605" y="691" text-anchor="middle" font-size="15" fill="#8a8a8a">cup touches the cube: joint created</text>
<text x="800" y="450" font-size="26" fill="#3a3a3a">›</text>
<text x="1000" y="250" text-anchor="middle" font-size="22" letter-spacing="4" fill="#fff">03 · CARRY</text>
<text x="1000" y="280" text-anchor="middle" font-size="16" fill="#2f80ff"></text>
<line x1="815" y1="600" x2="1185" y2="600" stroke="#3a3a3a" stroke-width="1.5"/>
