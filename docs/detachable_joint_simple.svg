<circle cx="1040.0" cy="365.0" r="7" fill="#000" stroke="#fff" stroke-width="2"/>
<rect x="1025.0" y="411.0" width="30.0" height="30.0" fill="#2f80ff"/>
<line x1="1040.0" y1="410.0" x2="1040.0" y2="411.0" stroke="#fff" stroke-width="5"/>
<circle cx="1040.0" cy="410.0" r="22" fill="none" stroke="#2f80ff" stroke-width="2"/>
<line x1="1062.0" y1="410.0" x2="1110.0" y2="418.0" stroke="#2f80ff" stroke-width="1.5"/>
<text x="1116.0" y="423.0" font-size="15" fill="#2f80ff">fixed joint</text>
<text x="1000" y="665" text-anchor="middle" font-size="15" letter-spacing="3" fill="#fff">ATTACHED</text>
<text x="1000" y="691" text-anchor="middle" font-size="15" fill="#8a8a8a">the cube follows the cup</text>
<text x="1195" y="450" font-size="26" fill="#3a3a3a">›</text>
<text x="1395" y="250" text-anchor="middle" font-size="22" letter-spacing="4" fill="#fff">04 · DETACH</text>
<text x="1395" y="280" text-anchor="middle" font-size="16" fill="#2f80ff">send “detach”</text>
<line x1="1210" y1="600" x2="1580" y2="600" stroke="#3a3a3a" stroke-width="1.5"/>
<rect x="1270" y="540" width="90" height="60" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="1470" y="540" width="90" height="60" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="1293" y="513" width="44" height="27" fill="#000" stroke="#fff" stroke-width="2"/>
<line x1="1315.0" y1="513.0" x2="1318.7" y2="385.1" stroke="#fff" stroke-width="16" stroke-linecap="round"/><line x1="1315.0" y1="513.0" x2="1318.7" y2="385.1" stroke="#000" stroke-width="13" stroke-linecap="round"/>
